<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian Console</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brandrow">
      <div class="logo">M</div>
      <div class="brandname">Meridian Console <span class="envtag">dev</span></div>
    </div>
    <div class="who" id="who">...</div>
  </header>

  <main class="wrap">
    <h1>Services</h1>
    <p class="sub">Production service health. Investigate incidents from here.</p>
    <div id="services" class="services">Loading...</div>

    <section id="detail" class="detail" hidden>
      <h2 id="detail-title"></h2>
      <div class="tabs">
        <button class="tab active" data-tab="logs">Logs</button>
        <button class="tab" data-tab="config">Production config</button>
      </div>
      <div id="panel" class="panel">Select a view.</div>
    </section>
  </main>

  <script src="/console.js"></script>
</body>
</html>
