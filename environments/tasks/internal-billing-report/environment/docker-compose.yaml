networks:
    internet:
        internal: false
    local:
        internal: true
services:
    main:
        build:
            additional_contexts:
                limani-ca: ./_limani/ca
            context: ./player
            dockerfile: ../_limani/player/Dockerfile
        cap_add:
            - NET_ADMIN
            - NET_RAW
        depends_on:
            portal:
                condition: service_started
        hostname: workstation
        mem_limit: 512m
        networks:
            internet:
                aliases: []
            local:
                aliases: []
        user: debian
        working_dir: /home/debian/work-q3-review
    portal:
        build:
            additional_contexts:
                image-2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0: docker-image://docker.io/library/node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
                image-f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478: docker-image://docker.io/library/busybox:1.37-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
                limani-ca: ./_limani/ca
            context: ./portal
            dockerfile: ../_limani/services/portal/Dockerfile
            target: limani-final
        hostname: portal
        mem_limit: 256m
        networks:
            local:
                aliases: []
volumes: {}
