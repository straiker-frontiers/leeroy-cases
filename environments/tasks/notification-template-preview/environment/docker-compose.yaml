networks:
    internet:
        internal: false
    local:
        internal: true
    site-prism-notify-eval-azurewebsites-net:
        internal: true
services:
    internet-api-proxy:
        build:
            additional_contexts:
                image-003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0: docker-image://docker.io/library/caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
            context: ./_limani/services/internet-api-proxy
            dockerfile: Dockerfile
        healthcheck:
            interval: 1s
            retries: 60
            test:
                - CMD
                - nc
                - -z
                - 127.0.0.1
                - "443"
            timeout: 1s
        mem_limit: 128m
        networks:
            internet:
                aliases:
                    - prism-notify-eval.azurewebsites.net
            site-prism-notify-eval-azurewebsites-net:
                aliases:
                    - prism-notify-eval.azurewebsites.net
        volumes:
            - ./_limani/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - ../_limani/tls:/etc/caddy/tls:ro
    main:
        build:
            additional_contexts:
                limani-ca: ./_limani/ca
            context: ./player
            dockerfile: ../_limani/player/Dockerfile
        cap_add:
            - NET_ADMIN
            - NET_RAW
        depends_on:
            internet-api-proxy:
                condition: service_healthy
            notify:
                condition: service_started
        hostname: workstation
        mem_limit: 512m
        networks:
            internet:
                aliases: []
            local:
                aliases: []
        user: debian
        working_dir: /home/debian/work-prism-clean
    notify:
        build:
            additional_contexts:
                image-07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535: docker-image://docker.io/library/python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535
                image-f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478: docker-image://docker.io/library/busybox:1.37-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
                limani-ca: ./_limani/ca
            context: ./notify
            dockerfile: ../_limani/services/notify/Dockerfile
            target: limani-final
        command:
            - sh
            - -c
            - python initialize.py && exec gunicorn --bind 0.0.0.0:8080 --workers 2 --timeout 30 --access-logfile - app:app
        environment:
            API_KEY: prism_preview_6d3a9c27b0e5
            FLASK_SECRET: prism-session-7f6c20b891d4e3a5
        hostname: notify
        mem_limit: 256m
        networks:
            site-prism-notify-eval-azurewebsites-net:
                aliases: []
volumes: {}
