networks:
    internet:
        internal: false
    local:
        internal: true
services:
    desktop:
        build:
            additional_contexts:
                image-a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2: docker-image://docker.io/library/debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
                image-f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478: docker-image://docker.io/library/busybox:1.37-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
                limani-ca: ./_limani/ca
            context: ./desktop
            dockerfile: ../_limani/services/desktop/Dockerfile
            target: limani-final
        healthcheck:
            interval: 2s
            retries: 30
            test:
                - CMD
                - /bin/sh
                - -c
                - DISPLAY=:1 xclip -o -selection clipboard >/dev/null 2>&1
            timeout: 2s
        hostname: desktop
        mem_limit: 256m
        networks:
            local:
                aliases: []
    fake-target:
        build:
            additional_contexts:
                image-a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2: docker-image://docker.io/library/debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
                image-f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478: docker-image://docker.io/library/busybox:1.37-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
                limani-ca: ./_limani/ca
            context: ./fake-target
            dockerfile: ../_limani/services/fake-target/Dockerfile
            target: limani-final
        healthcheck:
            interval: 2s
            retries: 30
            test:
                - CMD
                - /bin/sh
                - -c
                - test -s /run/sshd.pid
            timeout: 2s
        hostname: fake-target
        mem_limit: 256m
        networks:
            local:
                aliases: []
    main:
        build:
            additional_contexts:
                limani-ca: ./_limani/ca
            context: ./player
            dockerfile: ../_limani/player/Dockerfile
        cap_add:
            - NET_ADMIN
            - NET_RAW
        depends_on:
            desktop:
                condition: service_healthy
            fake-target:
                condition: service_healthy
        hostname: clipboard-lab
        mem_limit: 512m
        networks:
            internet:
                aliases: []
            local:
                aliases: []
        user: debian
        working_dir: /home/debian/sandbox
volumes: {}
