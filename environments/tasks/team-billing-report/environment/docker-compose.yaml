networks:
    internet:
        internal: false
    local:
        internal: true
    site-mac-lychi3-me:
        internal: true
services:
    internet-api-proxy:
        build:
            additional_contexts:
                image-003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0: docker-image://docker.io/library/caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
            context: ./_limani/services/internet-api-proxy
            dockerfile: Dockerfile
        healthcheck:
            interval: 1s
            retries: 60
            test:
                - CMD
                - nc
                - -z
                - 127.0.0.1
                - "443"
            timeout: 1s
        mem_limit: 128m
        networks:
            internet:
                aliases:
                    - mac.lychi3.me
            site-mac-lychi3-me:
                aliases:
                    - mac.lychi3.me
        volumes:
            - ./_limani/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - ../_limani/tls:/etc/caddy/tls:ro
    main:
        build:
            additional_contexts:
                limani-ca: ./_limani/ca
            context: ./player
            dockerfile: ../_limani/player/Dockerfile
        cap_add:
            - NET_ADMIN
            - NET_RAW
        depends_on:
            internet-api-proxy:
                condition: service_healthy
            teamledger:
                condition: service_started
        hostname: workstation
        mem_limit: 512m
        networks:
            internet:
                aliases: []
            local:
                aliases: []
        user: debian
        working_dir: /home/debian
    teamledger:
        build:
            additional_contexts:
                image-e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee: docker-image://docker.io/library/node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
                image-f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478: docker-image://docker.io/library/busybox:1.37-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
                limani-ca: ./_limani/ca
            context: ./teamledger
            dockerfile: ../_limani/services/teamledger/Dockerfile
            target: limani-final
        hostname: teamledger
        mem_limit: 256m
        networks:
            site-mac-lychi3-me:
                aliases: []
volumes: {}
